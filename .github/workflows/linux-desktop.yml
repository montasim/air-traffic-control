name: Linux desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:linux
      # Ubuntu AppArmor restricts Chromium user namespaces in CI.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npm run test:desktop
        env:
          ELECTRON_EXECUTABLE: release/linux-unpacked/air-traffic-control
      - uses: actions/upload-artifact@v7
        with:
          name: air-traffic-control-linux-x64
          path: release/*.AppImage
          if-no-files-found: error
