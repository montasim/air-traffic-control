[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Clean URL for the privacy policy (linked from Google Play and the other stores).
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
